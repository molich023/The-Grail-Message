<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sanctuary | Grail Message Kenya</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <style>
        :root {
            --gold: #D4AF37;
            --ethereal: #fcfdfd;
            --text: #2c3e50;
            --border: rgba(212, 175, 55, 0.2);
            --card-bg: rgba(255, 255, 255, 0.95);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #ffffff 0%, #eef6f7 100%);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── LOGIN SECTION ── */
        #loginGate {
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .admin-card {
            background: var(--card-bg);
            padding: 3rem; border-radius: 24px;
            width: 100%; max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
        }

        /* ── DASHBOARD SECTION ── */
        #adminDashboard { display: none; padding: 40px; }
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }
        h1, h2 { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 2px; }

        .stat-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 40px;
        }
        .stat-box {
            background: white; padding: 25px; border-radius: 15px;
            border: 1px solid var(--border); text-align: center;
        }
        .stat-box span { display: block; font-size: 0.8rem; text-transform: uppercase; color: #889; }
        .stat-box strong { font-size: 2rem; color: var(--gold); font-family: 'Cinzel'; }

        .data-table {
            width: 100%; border-collapse: collapse; background: white;
            border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }
        .data-table th { background: #f9fbfc; padding: 15px; text-align: left; font-size: 0.8rem; color: var(--gold); }
        .data-table td { padding: 15px; border-bottom: 1px solid #f1f1f1; font-size: 0.9rem; }

        /* UI ELEMENTS */
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #eee; border-radius: 8px; }
        .btn {
            background: var(--gold); color: white; border: none; padding: 12px 25px;
            border-radius: 8px; font-family: 'Cinzel'; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .h-captcha { margin: 15px 0; display: flex; justify-content: center; z-index: 9999; position: relative; }
    </style>
</head>
<body>

    <section id="loginGate">
        <div class="admin-card">
            <div style="color: var(--gold); font-size: 2rem; margin-bottom: 10px;">✦</div>
            <h2>Admin Sanctuary</h2>
            <p style="font-size: 0.8rem; margin-bottom: 30px; opacity: 0.7;">Authorised access for the Grail Message mission.</p>
            
            <input type="email" id="admEmail" placeholder="Guardian Email">
            <input type="password" id="admPass" placeholder="Security Key">
            
            <div class="h-captcha" data-sitekey="8d80ef5a-e924-4552-bd64-19725ab010b8"></div>

            <button class="btn" onclick="adminSignIn()" id="btnText">Enter Dashboard</button>
            <p id="err" style="color:red; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </section>

    <section id="adminDashboard">
        <nav class="top-nav">
            <h2>✦ Mission Control</h2>
            <button class="btn" style="background: transparent; color: var(--text); border: 1px solid var(--border);" onclick="signOut()">Leave Sanctuary</button>
        </nav>

        <div class="stat-grid">
            <div class="stat-box"><span>Subscribers</span><strong id="countSub">0</strong></div>
            <div class="stat-box"><span>Orders</span><strong id="countOrd">0</strong></div>
            <div class="stat-box"><span>Messages</span><strong id="countMsg">0</strong></div>
        </div>

        <h3 style="margin-bottom: 20px; font-family: 'Cinzel';">Recent Seekers</h3>
        <table class="data-table" id="subTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="subList">
                </tbody>
        </table>
    </section>

    <script>
        const _sb = supabase.createClient('https://ecxdrwomkxcuxlhqdtum.supabase.co', 'sb_publishable_RSqxhGRfsiQx95M77jnQzQ_K2jlVp3l');

        async function adminSignIn() {
            const email = document.getElementById('admEmail').value;
            const pass = document.getElementById('admPass').value;
            const token = hcaptcha.getResponse();
            const btn = document.getElementById('btnText');

            if (!token) { alert("Please verify your humanity."); return; }

            btn.innerText = "Authenticating...";
            
            const { data, error } = await _sb.auth.signInWithPassword({
                email, password, options: { captchaToken: token }
            });

            if (error) {
                document.getElementById('err').innerText = error.message;
                btn.innerText = "Enter Dashboard";
                hcaptcha.reset();
            } else {
                showDashboard();
            }
        }

        function showDashboard() {
            document.getElementById('loginGate').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            fetchData();
        }

        async function fetchData() {
            // Fetch Subscribers
            const { data: subs } = await _sb.from('subscribers').select('*').order('subscribed_at', { ascending: false });
            document.getElementById('countSub').innerText = subs ? subs.length : 0;

            const list = document.getElementById('subList');
            list.innerHTML = subs.map(s => `
                <tr>
                    <td>${s.first_name} ${s.last_name}</td>
                    <td>${s.email}</td>
                    <td>${new Date(s.subscribed_at).toLocaleDateString()}</td>
                    <td><span style="color:green">Active</span></td>
                </tr>
            `).join('');
        }

        async function signOut() {
            await _sb.auth.signOut();
            location.reload();
        }

        // Auto-check session on load
        window.onload = async () => {
            const { data: { session } } = await _sb.auth.getSession();
            if (session) showDashboard();
        };
    </script>
</body>
</html>
